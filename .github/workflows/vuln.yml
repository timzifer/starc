name: Vulnerability check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so newly published advisories are caught without a push.
    - cron: "17 5 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
